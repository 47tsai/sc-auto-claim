name: daily-claim

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # =========================
      # 🟢 帳號 A
      # =========================
      - name: Restore auth A
        run: echo '${{ secrets.AUTH_STATE }}' > auth.json

      - name: Run claim A
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          ACCOUNT_NAME: "各位原住民同胞大家好"
          ACCOUNT_ID: A
        run: node claim.js | tee result_A.txt

      # =========================
      # 🟢 帳號 B
      # =========================
      - name: Restore auth B
        run: echo '${{ secrets.AUTH_STATE_ALT }}' > auth.json

      - name: Run claim B
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          ACCOUNT_NAME: "食不食油餅"
          ACCOUNT_ID: B
        run: node claim.js | tee result_B.txt

      # =========================
      # 🟢 Update README
      # =========================
      - name: Update README
        run: |
          node - <<'NODE'
          const fs = require('fs');

          const accounts = [
            { name: '各位原住民同胞大家好', id: 'A' },
            { name: '食不食油餅', id: 'B' }
          ];

          const formatTime = (value) => {
            if (!value) return '尚無紀錄';
            return new Date(value).toLocaleString('zh-TW', {
              timeZone: 'Asia/Taipei',
              year: 'numeric',
              month: '2-digit',
              day: '2-digit',
              hour: '2-digit',
              minute: '2-digit',
              second: '2-digit',
              hour12: false
            });
          };

          const rows = accounts.map(({ name, id }) => {
            let state = {};
            try {
              state = JSON.parse(fs.readFileSync(`claim_state_${id}.json`, 'utf8'));
            } catch {}

            const resultFile = `result_${id}.txt`;
            let output = '';
            try {
              output = fs.readFileSync(resultFile, 'utf8');
            } catch {}

            const matches = [...output.matchAll(/RESULT=(success|failure)/g)];
            const latestResult = matches.length ? matches[matches.length - 1][1] : null;

            if (latestResult === 'success') {
              state.lastResult = '成功';
            } else if (latestResult === 'failure') {
              state.lastResult = '失敗';
            }

            const result = state.lastResult === '成功' ? '成功' :
              state.lastResult === '失敗' ? '失敗' : '尚無紀錄';

            return `| ${name} | ${formatTime(state.lastClaimAt)} | ${result} |`;
          }).join('\n');

          const readme = `# 荒野亂鬥自動領取\n\n| 帳號 | 上次簽到時間 | 簽到結果 |\n| --- | --- | --- |\n${rows}\n`;
          fs.writeFileSync('README.md', readme);
          NODE

      # =========================
      # 🟢 Commit state + README
      # =========================
      - name: Commit state and README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add claim_state_*.json README.md

          git diff --cached --quiet || git commit -m "update claim status"

          git push
